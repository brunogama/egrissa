---
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate source packages and publish release notes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Select Rust 1.85
        run: rustup override set 1.85.0

      - name: Check package metadata licenses
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("metadata.json").read_text())
          invalid = [
              package["name"]
              for package in metadata["packages"]
              if package.get("license") != "MIT"
          ]
          if invalid:
              raise SystemExit(
                  "workspace packages must declare the MIT license: "
                  + ", ".join(invalid)
              )
          PY

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Verify package contents
        run: cargo package --workspace --allow-dirty

      - name: Generate GitHub release changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
