---
name: Continuous integration

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add --toolchain 1.85.0 rustfmt clippy

      - name: Select Rust 1.85
        run: rustup override set 1.85.0

      - name: Check package metadata licenses
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("metadata.json").read_text())
          invalid = [
              package["name"]
              for package in metadata["packages"]
              if package.get("license") != "MIT"
          ]
          if invalid:
              raise SystemExit(
                  "workspace packages must declare the MIT license: "
                  + ", ".join(invalid)
              )
          PY

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: List package contents
        # Internal workspace crates are not on crates.io yet, so package
        # verification cannot resolve their published dependency versions.
        run: cargo package --workspace --list
