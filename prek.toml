minimum_prek_version = "0.5.0"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.env"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.env"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "detect-private-key"
files = "^\\.env"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "env-file-syntax"
name = "env file syntax (bash -n)"
language = "system"
entry = "bash -n"
files = "^\\.env"
pass_filenames = 1

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --check"
language = "system"
entry = "cargo fmt --all --check"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy -D warnings"
language = "system"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
files = "\\.rs$"
pass_filenames = false
