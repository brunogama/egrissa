[workspace]
members = [
    "crates/egress-core",
    "crates/identity-core",
    "crates/route-core",
    "crates/observation-core",
    "crates/verification-core",
    "crates/transport-core",
    "crates/egress-runtime",
    "crates/socks5-adapter",
    "crates/http-connect-adapter",
    "crates/relay-adapter",
    "crates/masque-adapter",
    "crates/provider-core",
    "crates/reference-provider-adapter",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
egress-core = { path = "crates/egress-core", version = "0.1.0" }
identity-core = { path = "crates/identity-core", version = "0.1.0" }
observation-core = { path = "crates/observation-core", version = "0.1.0" }
route-core = { path = "crates/route-core", version = "0.1.0" }
verification-core = { path = "crates/verification-core", version = "0.1.0" }
egress-runtime = { path = "crates/egress-runtime", version = "0.1.0" }
socks5-adapter = { path = "crates/socks5-adapter", version = "0.1.0" }
http-connect-adapter = { path = "crates/http-connect-adapter", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
transport-core = { path = "crates/transport-core", version = "0.1.0" }
relay-adapter = { path = "crates/relay-adapter", version = "0.1.0" }
masque-adapter = { path = "crates/masque-adapter", version = "0.1.0" }
provider-core = { path = "crates/provider-core", version = "0.1.0" }
reference-provider-adapter = { path = "crates/reference-provider-adapter", version = "0.1.0" }
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
