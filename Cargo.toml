[workspace]
resolver = "3"
members = ["crates/egress-core", "crates/identity-core", "crates/route-core", "crates/observation-core", "crates/verification-core", "crates/transport-core", "crates/egress-runtime", "crates/socks5-adapter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
egress-core = { path = "crates/egress-core" }
identity-core = { path = "crates/identity-core" }
observation-core = { path = "crates/observation-core" }
route-core = { path = "crates/route-core" }
verification-core = { path = "crates/verification-core" }
egress-runtime = { path = "crates/egress-runtime" }
socks5-adapter = { path = "crates/socks5-adapter" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
transport-core = { path = "crates/transport-core" }
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
